# One Gitea Actions job per check. Not a single combined job.
#
# act_runner starts a new container per job. The prepare job clones
# GITHUB_SHA with the job token over HTTPS, installs the shared tree
# once (OS packages, CPAN local-lib via make deps, gitleaks), and
# persists it through the runner artifact HTTP API. Check jobs restore
# that tree and only run their Make gate.
#
# Do not git init or set init.defaultBranch here. Do not use
# actions/checkout (unreliable on this fleet's runner). Do not use
# actions/upload-artifact or download-artifact; transfer with run: +
# the artifact pipeline API (same token HTTPS as clone).
name: precommit

on:
  push:
  pull_request:

concurrency:
  group: precommit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    container:
      image: docker.io/library/perl:5.40-bookworm
      env:
        GITHUB_TOKEN: ${{ github.token }}
    steps:
      - run: apt-get update -qq && apt-get install -y --no-install-recommends git ca-certificates libpq-dev gcc libc6-dev make curl tar
      - run: |
          set -euo pipefail
          token="${GITHUB_TOKEN:-${GITEA_TOKEN:-}}"
          if [ -z "$token" ]; then echo "missing job token for git fetch" >&2; exit 1; fi
          host="${GITHUB_SERVER_URL#https://}"
          host="${host#http://}"
          git clone "https://x-access-token:${token}@${host}/${GITHUB_REPOSITORY}" .
          git fetch --force origin "${GITHUB_SHA}"
          git checkout --force "${GITHUB_SHA}"
      - run: make deps
      - run: |
          set -euo pipefail
          mkdir -p local/bin
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz -C local/bin gitleaks
          chmod +x local/bin/gitleaks
          local/bin/gitleaks version
      - run: perl .gitea/ci/env.pl upload

  tests:
    needs: prepare
    runs-on: ubuntu-latest
    container:
      image: docker.io/library/perl:5.40-bookworm
      env:
        GITHUB_TOKEN: ${{ github.token }}
    steps:
      - run: |
          set -euo pipefail
          token="${GITHUB_TOKEN:-${GITEA_TOKEN:-}}"
          if [ -z "$token" ]; then echo "missing job token" >&2; exit 1; fi
          host="${GITHUB_SERVER_URL#https://}"
          host="${host#http://}"
          out=/tmp/ci-env.pl
          api="${GITHUB_SERVER_URL}/api/v1/repos/${GITHUB_REPOSITORY}/raw/.gitea/ci/env.pl?ref=${GITHUB_SHA}"
          raw="https://x-access-token:${token}@${host}/${GITHUB_REPOSITORY}/raw/commit/${GITHUB_SHA}/.gitea/ci/env.pl"
          if ! curl -fsSL -H "Authorization: token ${token}" "$api" -o "$out"; then
            if ! curl -fsSL -H "Authorization: Bearer ${token}" "$api" -o "$out"; then
              curl -fsSL "$raw" -o "$out"
            fi
          fi
          perl /tmp/ci-env.pl restore
      - run: make test

  sast:
    needs: prepare
    runs-on: ubuntu-latest
    container:
      image: docker.io/library/perl:5.40-bookworm
      env:
        GITHUB_TOKEN: ${{ github.token }}
    steps:
      - run: |
          set -euo pipefail
          token="${GITHUB_TOKEN:-${GITEA_TOKEN:-}}"
          if [ -z "$token" ]; then echo "missing job token" >&2; exit 1; fi
          host="${GITHUB_SERVER_URL#https://}"
          host="${host#http://}"
          out=/tmp/ci-env.pl
          api="${GITHUB_SERVER_URL}/api/v1/repos/${GITHUB_REPOSITORY}/raw/.gitea/ci/env.pl?ref=${GITHUB_SHA}"
          raw="https://x-access-token:${token}@${host}/${GITHUB_REPOSITORY}/raw/commit/${GITHUB_SHA}/.gitea/ci/env.pl"
          if ! curl -fsSL -H "Authorization: token ${token}" "$api" -o "$out"; then
            if ! curl -fsSL -H "Authorization: Bearer ${token}" "$api" -o "$out"; then
              curl -fsSL "$raw" -o "$out"
            fi
          fi
          perl /tmp/ci-env.pl restore
      - run: make sast

  audit:
    needs: prepare
    runs-on: ubuntu-latest
    container:
      image: docker.io/library/perl:5.40-bookworm
      env:
        GITHUB_TOKEN: ${{ github.token }}
    steps:
      - run: |
          set -euo pipefail
          token="${GITHUB_TOKEN:-${GITEA_TOKEN:-}}"
          if [ -z "$token" ]; then echo "missing job token" >&2; exit 1; fi
          host="${GITHUB_SERVER_URL#https://}"
          host="${host#http://}"
          out=/tmp/ci-env.pl
          api="${GITHUB_SERVER_URL}/api/v1/repos/${GITHUB_REPOSITORY}/raw/.gitea/ci/env.pl?ref=${GITHUB_SHA}"
          raw="https://x-access-token:${token}@${host}/${GITHUB_REPOSITORY}/raw/commit/${GITHUB_SHA}/.gitea/ci/env.pl"
          if ! curl -fsSL -H "Authorization: token ${token}" "$api" -o "$out"; then
            if ! curl -fsSL -H "Authorization: Bearer ${token}" "$api" -o "$out"; then
              curl -fsSL "$raw" -o "$out"
            fi
          fi
          perl /tmp/ci-env.pl restore
      - run: make audit

  gitleaks:
    needs: prepare
    runs-on: ubuntu-latest
    container:
      image: docker.io/library/perl:5.40-bookworm
      env:
        GITHUB_TOKEN: ${{ github.token }}
    steps:
      - run: |
          set -euo pipefail
          token="${GITHUB_TOKEN:-${GITEA_TOKEN:-}}"
          if [ -z "$token" ]; then echo "missing job token" >&2; exit 1; fi
          host="${GITHUB_SERVER_URL#https://}"
          host="${host#http://}"
          out=/tmp/ci-env.pl
          api="${GITHUB_SERVER_URL}/api/v1/repos/${GITHUB_REPOSITORY}/raw/.gitea/ci/env.pl?ref=${GITHUB_SHA}"
          raw="https://x-access-token:${token}@${host}/${GITHUB_REPOSITORY}/raw/commit/${GITHUB_SHA}/.gitea/ci/env.pl"
          if ! curl -fsSL -H "Authorization: token ${token}" "$api" -o "$out"; then
            if ! curl -fsSL -H "Authorization: Bearer ${token}" "$api" -o "$out"; then
              curl -fsSL "$raw" -o "$out"
            fi
          fi
          perl /tmp/ci-env.pl restore
      - run: make secrets

  style:
    needs: prepare
    runs-on: ubuntu-latest
    container:
      image: docker.io/library/perl:5.40-bookworm
      env:
        GITHUB_TOKEN: ${{ github.token }}
    steps:
      - run: |
          set -euo pipefail
          token="${GITHUB_TOKEN:-${GITEA_TOKEN:-}}"
          if [ -z "$token" ]; then echo "missing job token" >&2; exit 1; fi
          host="${GITHUB_SERVER_URL#https://}"
          host="${host#http://}"
          out=/tmp/ci-env.pl
          api="${GITHUB_SERVER_URL}/api/v1/repos/${GITHUB_REPOSITORY}/raw/.gitea/ci/env.pl?ref=${GITHUB_SHA}"
          raw="https://x-access-token:${token}@${host}/${GITHUB_REPOSITORY}/raw/commit/${GITHUB_SHA}/.gitea/ci/env.pl"
          if ! curl -fsSL -H "Authorization: token ${token}" "$api" -o "$out"; then
            if ! curl -fsSL -H "Authorization: Bearer ${token}" "$api" -o "$out"; then
              curl -fsSL "$raw" -o "$out"
            fi
          fi
          perl /tmp/ci-env.pl restore
      - run: make lint
