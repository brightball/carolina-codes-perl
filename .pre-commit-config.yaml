# Local pre-commit hooks. Emergency escape: SKIP=local-tests,sast,audit,gitleaks,lint git commit
# Install once: make hooks   (or: pre-commit install)
repos:
  - repo: local
    hooks:
      - id: local-tests
        name: local tests
        language: system
        entry: make test
        pass_filenames: false
        always_run: true
      - id: sast
        name: static security scanner
        language: system
        entry: make sast
        pass_filenames: false
        always_run: true
      - id: audit
        name: 3rd-party dependency scanner
        language: system
        entry: make audit
        pass_filenames: false
        always_run: true
      - id: gitleaks
        name: gitleaks
        language: system
        entry: make secrets
        pass_filenames: false
        always_run: true
      - id: lint
        name: perltidy
        language: system
        entry: make lint
        pass_filenames: false
        always_run: true
